name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: lint-imports

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/integration tests/behavioral
        # coverage gate (--cov-fail-under=80) lives in pyproject.toml pytest addopts

  image-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wafi:ci .
      - name: run and smoke test container
        run: |
          docker run -d --rm --name wafi-ci -p 8000:8000 wafi:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/ready && break || sleep 1
          done
          curl -sf http://localhost:8000/ready
          curl -sf -X POST http://localhost:8000/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "ci smoke test ticket"}'
          docker stop wafi-ci

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: image-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push tagged with commit SHA
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
